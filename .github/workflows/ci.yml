name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  RUST_CI: true

jobs:
  check:
    name: "ubuntu: cargo clippy && cargo test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libdbus-glib-1-dev
      # Formatting enforcement deferred until a dedicated source-formatting cleanup.
      - name: Unit tests
        run: cargo test --workspace --exclude kv_core

      - name: Core unit tests
        run: cargo test -p kv_core --lib

      - name: Inspect installed browsers
        run: |
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              echo "$browser: $(command -v "$browser")"
              "$browser" --version
            fi
          done

      - name: Chromium integration test
        if: ${{ !cancelled() }}
        run: cargo test -p kv_core --test download_songs

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets

  check-win:
    name: "win: cargo clippy && cargo test"
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo test
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets

  check-macos:
    name: "macos: cargo clippy && cargo test"
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Unit tests
        run: cargo test --workspace --exclude kv_core

      - name: Core unit tests
        run: cargo test -p kv_core --lib

      - name: Chromium integration test
        if: ${{ !cancelled() }}
        run: cargo test -p kv_core --test download_songs

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets
